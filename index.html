<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Inventory</title>

    <link rel="stylesheet" href="style.css?v=19">
</head>


<body>

    <header>
        <h1>Home Inventory</h1>
        <p>Keep track of what's in your home</p>
    </header>


    <main>

        <!-- Search -->
        <section class="search-section">

            <div class="search-wrapper">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search inventory..."
                >

                <button
                    type="button"
                    id="clearSearchButton"
                    aria-label="Clear search">
                    ×
                </button>

            </div>

        </section>


        <!-- Locations -->
        <section class="locations">

            <button class="location-card" data-location="Pantry 1">
                <span class="location-icon">🥫</span>
                <span class="location-name">Pantry 1</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Pantry 2">
                <span class="location-icon">🥫</span>
                <span class="location-name">Pantry 2</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Fridge 1">
                <span class="location-icon">🥛</span>
                <span class="location-name">Fridge 1</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Fridge 2">
                <span class="location-icon">🥛</span>
                <span class="location-name">Fridge 2</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Freezer 1">
                <span class="location-icon">❄️</span>
                <span class="location-name">Freezer 1</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Freezer 2">
                <span class="location-icon">❄️</span>
                <span class="location-name">Freezer 2</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Chest Freezer">
                <span class="location-icon">🧊</span>
                <span class="location-name">Chest Freezer</span>
                <span class="location-count">0</span>
            </button>


            <button class="location-card" data-location="Laundry">
                <span class="location-icon">🧺</span>
                <span class="location-name">Laundry</span>
                <span class="location-count">0</span>
            </button>

        </section>


        <!-- Inventory -->
        <section class="inventory-section">

            <div class="inventory-heading">

                <h2 id="inventoryTitle">📦 All Inventory</h2>

                <div>
                    <button id="showAllButton">
                        Show All
                    </button>

                    <button id="expiringSoonButton">
                        ⏰ Expiring Soon
                    </button>

                    <button id="addItemButton">
                        + Add Item
                    </button>
                </div>

            </div>


            <div id="inventoryList"></div>

        </section>

    </main>


    <!-- Scan button -->
    <button class="scan-button" id="scanBarcodeButton">
    📷 Scan Barcode
    </button>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close-button">&times;</span>

            <h2>Add Item</h2>

            <form id="addItemForm">

                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    required
                >

                <label for="barcode">Barcode</label>
                <input
                    type="text"
                    id="barcode"
                    placeholder="Optional"
                >

                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Toiletries">Toiletries</option>
                    <option value="Household">Household</option>
                    <option value="Other">Other</option>
                </select>

                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    min="1"
                    value="1"
                    required
                >

                <label for="unit">Unit</label>
                <select id="unit">
                    <option value="item">Item</option>
                    <option value="can">Can</option>
                    <option value="bottle">Bottle</option>
                    <option value="packet">Packet</option>
                    <option value="box">Box</option>
                    <option value="bag">Bag</option>
                    <option value="jar">Jar</option>
                    <option value="portion">Portion</option>
                </select>

                <label for="location">Location</label>
                <select id="location" required>
                    <option value="Pantry 1">Pantry 1</option>
                    <option value="Pantry 2">Pantry 2</option>
                    <option value="Fridge 1">Fridge 1</option>
                    <option value="Fridge 2">Fridge 2</option>
                    <option value="Freezer 1">Freezer 1</option>
                    <option value="Freezer 2">Freezer 2</option>
                    <option value="Chest Freezer">Chest Freezer</option>
                    <option value="Laundry">Laundry</option>
                </select>

                <label for="expiryDate">Expiry Date</label>
                <input
                    type="date"
                    id="expiryDate"
                >

                <button type="submit" class="save-item-button">
                    Add to Inventory
                </button>

            </form>

        </div>

    </div>

    <!-- Edit Item Modal -->
    <div id="editItemModal" class="modal">

        <div class="modal-content">

            <span id="closeEditModal" class="close-button">&times;</span>

            <h2>Edit Item</h2>

            <form id="editItemForm">

                <input type="hidden" id="editIndex">

                <label for="editProductName">Product Name</label>
                <input
                    type="text"
                    id="editProductName"
                    required
                >

                <label for="editBarcode">Barcode</label>
                <input
                    type="text"
                    id="editBarcode"
                    placeholder="Optional"
                >

                <label for="editCategory">Category</label>
                <select id="editCategory">

                    <option value="Food">Food</option>
                    <option value="Drinks">Drinks</option>
                    <option value="Cleaning">Cleaning</option>
                    <option value="Toiletries">Toiletries</option>
                    <option value="Household">Household</option>
                    <option value="Other">Other</option>

                </select>

                <label for="editQuantity">Quantity</label>
                <input
                    type="number"
                    id="editQuantity"
                    min="1"
                    required
                >

                <label for="editUnit">Unit</label>
                <select id="editUnit">

                    <option value="item">Item</option>
                    <option value="can">Can</option>
                    <option value="bottle">Bottle</option>
                    <option value="packet">Packet</option>
                    <option value="box">Box</option>
                    <option value="bag">Bag</option>
                    <option value="jar">Jar</option>
                    <option value="portion">Portion</option>

                </select>

                <label for="editLocation">Location</label>
                <select id="editLocation" required>

                    <option value="Pantry 1">Pantry 1</option>
                    <option value="Pantry 2">Pantry 2</option>
                    <option value="Fridge 1">Fridge 1</option>
                    <option value="Fridge 2">Fridge 2</option>
                    <option value="Freezer 1">Freezer 1</option>
                    <option value="Freezer 2">Freezer 2</option>
                    <option value="Chest Freezer">Chest Freezer</option>
                    <option value="Laundry">Laundry</option>

                </select>

                <label for="editExpiryDate">Expiry Date</label>
                <input
                    type="date"
                    id="editExpiryDate"
                >

                <button
                    type="submit"
                    class="save-item-button">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

    <!-- Barcode Scanner Modal -->
    <div id="scannerModal" class="modal">

        <div class="modal-content scanner-content">

            <span id="closeScanner" class="close-button">&times;</span>

            <h2>Scan Barcode</h2>

            <p class="scanner-instructions">
                Point your camera at the product barcode.
            </p>

            <video
                id="scannerVideo"
                autoplay
                playsinline>
            </video>

            <p id="scannerStatus">
                Starting camera...
            </p>

        </div>

    </div>


    <!-- ZXing barcode scanning library -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/browser@latest"></script>

    <script src="app.js?v=19"></script>

</body>

</html>
